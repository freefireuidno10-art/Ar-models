<!DOCTYPE html>
<html lang="en">
<head>
    <title>My 3D Model AR</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    <style>
        model-viewer {
            width: 100%;
            height: 95vh;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="https://drive.google.com/uc?export=download&id=13PY8E3v9-_wpwLa0OFg_kIfyDyOlO0u" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        shadow-intensity="1" 
        auto-rotate>
        <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
            👋 View in AR
        </button>
    </model-viewer>

</body>
</html>
