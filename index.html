<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; }
        model-viewer { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <model-viewer 
    src="model.glb" 
    ar 
    ar-modes="quick-look scene-viewer webxr" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    alt="3D Model">
    <button slot="ar-button" style="background-color: white; border-radius: 4px; border: none; position: absolute; top: 16px; right: 16px; padding: 10px;">
        👋 Activate AR
    </button>
</model-viewer>


</body>
</html>
