<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { margin: 0; background-color: #f8f9fa; }
        model-viewer { width: 100%; height: 100vh; }
    </style>
</head>
<body>

    <model-viewer 
        src="https://drive.google.com/uc?export=download&id=13PY8E3v9-_wpwLa0OFg_kIfyDyOlO0u" 
        ar 
        ar-modes="webxr scene-viewer quick-look fallback" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1"
        alt="My 3D Project Model">
        
        <div id="error" style="display:none; position:absolute; bottom: 20px; width: 100%; text-align: center; color: red;">
            AR is not supported on this device, but you can still view it in 3D!
        </div>
    </model-viewer>

</body>
</html>
